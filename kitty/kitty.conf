# clawdots: black + macOS grays, one orange accent
font_family      JetBrains Mono
font_size        12.0

# colors
foreground              #f5f5f7
background              #000000
selection_foreground    #000000
selection_background    #da7756
cursor                  #da7756
cursor_text_color       #000000
url_color               #da7756
active_border_color     #da7756
inactive_border_color   #3a3a3c

color0  #1c1c1e
color8  #3a3a3c
color1  #da7756
color9  #e8967a
color2  #8e8e93
color10 #aeaeb2
color3  #c9a27e
color11 #dcc0a2
color4  #98989d
color12 #c7c7cc
color5  #b08a7a
color13 #cdaa9b
color6  #8e8e93
color14 #aeaeb2
color7  #d1d1d6
color15 #f5f5f7

# flat and square
window_padding_width   12
background_opacity     1.0
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell      no

# cursor: solid orange block
cursor_shape           block
cursor_blink_interval  0

# tabs: flat bar, orange active tab
tab_bar_edge           top
tab_bar_style          separator
tab_separator          " "
tab_bar_min_tabs       2
active_tab_foreground   #000000
active_tab_background   #da7756
inactive_tab_foreground #8e8e93
inactive_tab_background #1c1c1e
tab_bar_background      #000000

scrollback_lines 5000
copy_on_select   yes
strip_trailing_spaces smart

map ctrl+shift+n new_os_window
map ctrl+t new_tab
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

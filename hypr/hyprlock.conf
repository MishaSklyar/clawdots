# clawdots lock: black, Clawd, big orange clock

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(000000)
}

image {
    monitor =
    path = ~/clawdots/wallpaper/clawd-lock.png
    size = 120
    rounding = 0
    border_size = 0
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(da7756)
    font_size = 72
    font_family = JetBrains Mono ExtraBold
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b" | tr A-Z a-z
    color = rgb(8e8e93)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 5
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 40
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(3a3a3c)
    inner_color = rgb(000000)
    check_color = rgb(da7756)
    fail_color = rgb(e8967a)
    font_color = rgb(f5f5f7)
    font_family = JetBrains Mono
    fade_on_empty = false
    placeholder_text = claw'd
    fail_text = nope ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.4
    dots_rounding = 0
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(3a3a3c)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, -100
    halign = center
    valign = center
}
